name: Swift CI (reusable)

# Reusable `workflow_call` build+test workflow intended to become the single
# CI definition for the estate's Swift repos — both SwiftPM packages
# (manifold-llama, manifold-mlx, manifold-eval) and XcodeGen app repos
# (basechat). Callers keep their own `push`/`pull_request` triggers (plus a
# caller-side `concurrency` block — see WORKFLOWS.md) and invoke this via
# `jobs.<id>.uses`.
#
# `mode: spm` runs `swift build`/`swift test` directly against the checked
# out package. `mode: xcodegen` runs `xcodegen generate` then
# `xcodebuild build`/`xcodebuild test` against the generated .xcodeproj.
on:
  workflow_call:
    inputs:
      mode:
        description: >
          "spm" for a SwiftPM package (swift build / swift test). "xcodegen"
          for an XcodeGen app repo (xcodegen generate, then xcodebuild).
        required: false
        type: string
        default: spm
      runner:
        description: >
          JSON-encoded runs-on value, consumed via fromJSON() into runs-on
          below. Must be valid JSON, so a single label needs its own quotes
          escaped into the string, e.g. '"macos-15"'. A runner group/label
          array is passed the same way, e.g. '["self-hosted", "macos"]'.
        required: false
        type: string
        default: '"macos-15"'
      xcode-version:
        description: "Xcode version, passed through to actions/setup-swift-ci."
        required: false
        type: string
        default: "26.3"
      skip-xcode-select:
        description: >
          Self-hosted runners manage their own toolchain; set true to skip
          Xcode version selection entirely (both spm and xcodegen modes).
          Omitting this preserves current behavior exactly — GitHub-hosted
          runners still get the explicit `xcode-version` selection.
        required: false
        type: boolean
        default: false
      cache-key-suffix:
        description: "Passed through to actions/setup-swift-ci."
        required: false
        type: string
        default: ""
      build-command:
        description: "spm mode only: shell command that builds the package."
        required: false
        type: string
        default: "swift build --build-tests"
      test-command:
        description: "spm mode only: shell command that runs the package's tests."
        required: false
        type: string
        default: "swift test"
      project:
        description: "xcodegen mode only: the generated .xcodeproj name, e.g. BaseChat.xcodeproj."
        required: false
        type: string
      scheme:
        description: "xcodegen mode only: the xcodebuild scheme to build/test."
        required: false
        type: string
      destination:
        description: "xcodegen mode only: the xcodebuild -destination value."
        required: false
        type: string
        default: "platform=iOS Simulator,name=iPhone 16"
      run-tests:
        description: >
          xcodegen mode only: run `xcodebuild test` when true, `xcodebuild
          build` when false.
        required: false
        type: boolean
        default: true
      extra-xcodebuild-flags:
        description: "xcodegen mode only: extra flags appended to the xcodebuild invocation."
        required: false
        type: string
        default: "-skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO"
      timeout-minutes:
        description: "Job timeout in minutes."
        required: false
        type: number
        default: 45
      lint:
        description: >
          Opt-in: run `swift-format lint --recursive --strict --parallel
          --follow-symlinks` over the checked-out sources, using the
          toolchain's bundled `swift-format` (invoked via `xcrun` AFTER Xcode
          selection, so it resolves against the caller's pinned
          `xcode-version` rather than the runner image's default — this
          ordering, not toolchain-bundling alone, is what makes the result
          comparable across hosted and self-hosted callers) — no separate
          install step. Scope: top-level directories (recursed,
          `.swift`-filtered, symlinks followed) plus top-level `*.swift`
          files; `.build`, `.git`, and other non-`.swift` top-level files are
          excluded — see WORKFLOWS.md for the full mechanism and why.
          Default false: existing callers see zero change until they
          explicitly set this true. A repo with unformatted history should
          NOT flip this on until a one-time `swift-format format --recursive
          --in-place` pass has landed first — this input only checks, it
          never rewrites.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    # NO job-level draft guard. This job previously carried
    #   if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # which skipped the whole job on draft PRs — and a *skipped* required check
    # counts as PASSING for branch protection. So a draft PR could satisfy
    # `test / build-and-test` without ever building, and stay satisfied after
    # being marked ready if no fresh run landed on that SHA.
    #
    # That is not theoretical. On 2026-07-20 manifold-llama#153 (a `feat!:`
    # breaking change) was pushed and marked ready in the same second: the
    # synchronize run evaluated draft==true and skipped, the ready_for_review
    # run was cancelled by `cancel-in-progress` concurrency in the caller, and
    # auto-merge fired on the skipped-therefore-"passing" check. It merged with
    # the gate never having built it; only the post-merge run on main caught up
    # (and happened to be green).
    #
    # Fix: the job always runs, and on a draft it FAILS FAST before any
    # expensive step, so the check can only be GREEN if a real build ran. No
    # branch-protection change is needed — the job (and therefore the context
    # name, `<caller job id> / build-and-test`) is unchanged, so the existing
    # required context becomes meaningful as-is. Verified against live branch
    # protection: manifold-mlx and manifold-llama both require
    # `test / build-and-test`, and both name their calling job `test`.
    #
    # COST: a draft still costs ONE runner allocation — the job is scheduled,
    # not skipped, so a runner is queued and booted before step 1 exits. It no
    # longer burns *build* minutes, but on `macos-15` (billed 10x, and capped
    # org-wide at ~5 concurrent) that boot would take a slot other queued jobs
    # wait behind — and this estate opens a draft PR the moment code compiles,
    # so that is every draft push across four repos. Drafts are therefore
    # routed to `ubuntu-latest`, which only ever runs `exit 1`. The context
    # name is unaffected by the runner, so this is invisible to branch
    # protection.
    #
    # The ternary selects the JSON *text* and applies fromJSON once, rather
    # than returning a bare string on one branch and a fromJSON() result on the
    # other. `runner` is documented above to accept an ARRAY form
    # ('["self-hosted", "macos"]') for runner groups/labels, and mixing a plain
    # string with an array across `||` risks the array's typing not surviving
    # to `runs-on` — which would break the real build path for a self-hosted
    # caller while the draft path it optimizes works fine. Selecting the text
    # keeps both branches identically typed, so array callers are unaffected.
    #
    # NOTE: this condition and step 0's `if` below must stay in agreement —
    # ubuntu is chosen precisely when step 0 aborts the job. If a future edit
    # changes one and not the other, a real Swift build lands on ubuntu. That
    # fails loudly (no Swift toolchain), never silently green, but keep them
    # in sync anyway.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.draft) && '"ubuntu-latest"' || inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Draft PR — not verified
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: |
          echo "::notice title=Draft not verified::This PR is a draft, so the build/test gate did not run. Mark it ready for review to verify it — this red check is expected and blocks an accidental merge on an unverified result."
          exit 1

      # `mode` is a free-form string input, and EVERY build/test step below is
      # gated on `inputs.mode == 'spm'` or `== 'xcodegen'`. An unrecognized
      # value (`SPM`, a typo, an empty template expansion, or a third mode
      # added later without wiring) would skip all of them and let the job exit
      # SUCCESS having built nothing — reintroducing, via one character, the
      # exact green-without-a-build hole this workflow now exists to prevent.
      # Fail closed on anything unrecognized.
      # No `if:` needed — on a draft the step above already failed, and GitHub
      # skips the rest of the job by default.
      - name: Validate mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$MODE" in
            spm|xcodegen) echo "mode=$MODE" ;;
            *)
              echo "::error title=Unknown mode::inputs.mode='$MODE' is not one of: spm, xcodegen. Every build/test step is gated on those values, so an unrecognized mode would report a green check having built nothing." >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Swift CI (spm)
        # spm mode only: the composite's SwiftPM cache keys on
        # hashFiles('Package.resolved'), which an XcodeGen app repo doesn't
        # have — in xcodegen mode the cache would always miss (empty hash)
        # and never cover xcodebuild's DerivedData anyway, so it's pure
        # overhead there.
        if: inputs.mode == 'spm'
        uses: ManifoldKit/.github/.github/actions/setup-swift-ci@main
        with:
          xcode-version: ${{ inputs.xcode-version }}
          cache-key-suffix: ${{ inputs.cache-key-suffix }}
          verify-toolchain: "true"
          skip-xcode-select: ${{ inputs.skip-xcode-select }}

      - name: Select Xcode (xcodegen)
        # xcodegen mode gets only the toolchain selection, not the composite
        # (see the spm step's comment). Same SHA pin as setup-swift-ci. Skipped
        # entirely on self-hosted runners via skip-xcode-select (see input doc).
        if: inputs.mode == 'xcodegen' && inputs.skip-xcode-select != true
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - name: Lint (swift-format)
        # Opt-in, default false — see the `lint` input doc above. MUST run
        # after both toolchain-selection steps above ("Setup Swift CI (spm)"
        # and "Select Xcode (xcodegen)"), not before: `swift-format` is
        # invoked via `xcrun`, which resolves against whatever toolchain
        # `xcode-select` currently points at. Running this before selection
        # (the first cut of this step did) would lint against the runner
        # image's default Xcode instead of the caller's pinned
        # `xcode-version`, for every caller except a self-hosted one that
        # sets `skip-xcode-select: true` (only idlewick today) — meaning the
        # gate's verdict would silently drift whenever GitHub rotates the
        # `macos-15` image's default Xcode, independent of what the caller
        # actually pinned. This ordering, not toolchain-bundling by itself,
        # is what makes the lint result comparable across hosted and
        # self-hosted callers. `--strict` makes any diagnostic (not just
        # errors) a non-zero exit.
        if: inputs.lint == true
        run: |
          set -euo pipefail
          # Lint top-level dirs (recursed into, .swift-filtered by
          # --recursive, symlinks followed) plus top-level *.swift files;
          # .build and .git are excluded — .build holds SwiftPM's fetched
          # dependency checkouts (not this repo's own code) plus
          # plugin-generated sources, neither of which this caller's style
          # pass ever wrote or owns. `swift-format lint` only filters to
          # *.swift when recursing into a directory — an explicit file
          # argument is parsed as Swift regardless of extension, so passing
          # e.g. README.md or Package.resolved directly floods the run with
          # parse errors on non-Swift syntax.
          targets=()
          for entry in * .[!.]*; do
            [ -e "$entry" ] || continue
            case "$entry" in
              .build|.git) continue ;;
            esac
            if [ -d "$entry" ] || [[ "$entry" == *.swift ]]; then
              targets+=("$entry")
            fi
          done
          # A repo's top-level always has SOME directory (.github at least),
          # so `targets` is never empty in practice and an "if no targets,
          # exit 0" check is dead code that never fires — the real silent
          # hole is a repo whose Swift sources are found by neither branch
          # (e.g. entirely behind a top-level symlink that recursion doesn't
          # follow). Count real *.swift files in scope, following symlinks
          # to match --follow-symlinks below, and fail loudly rather than
          # let a check-nothing run report the same green as a clean one.
          swift_file_count=$(find -L "${targets[@]}" -type f -name '*.swift' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$swift_file_count" -eq 0 ]; then
            echo "::error title=No Swift sources found::lint is enabled but zero *.swift files were found under: ${targets[*]:-<none>}. A green lint check that found nothing to check is indistinguishable from a genuinely clean one, so this fails loudly instead of passing silently. If this repo truly has no Swift sources, disable the lint input rather than let it report a false pass." >&2
            exit 1
          fi
          echo "Linting $swift_file_count Swift file(s)."
          xcrun swift-format lint --recursive --strict --parallel --follow-symlinks "${targets[@]}"

      - name: Build (spm)
        if: inputs.mode == 'spm'
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          set -euo pipefail
          eval "$BUILD_COMMAND"

      - name: Test (spm)
        if: inputs.mode == 'spm'
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          eval "$TEST_COMMAND"

      - name: Install xcodegen
        if: inputs.mode == 'xcodegen'
        run: |
          set -euo pipefail
          command -v xcodegen || brew install xcodegen

      - name: Generate Xcode project
        if: inputs.mode == 'xcodegen'
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Build (xcodegen)
        if: inputs.mode == 'xcodegen' && inputs.run-tests == false
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          DESTINATION: ${{ inputs.destination }}
          EXTRA_FLAGS: ${{ inputs.extra-xcodebuild-flags }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # EXTRA_FLAGS is intentionally word-split into multiple xcodebuild args
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            $EXTRA_FLAGS

      - name: Test (xcodegen)
        if: inputs.mode == 'xcodegen' && inputs.run-tests == true
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          DESTINATION: ${{ inputs.destination }}
          EXTRA_FLAGS: ${{ inputs.extra-xcodebuild-flags }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # EXTRA_FLAGS is intentionally word-split into multiple xcodebuild args
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            $EXTRA_FLAGS
